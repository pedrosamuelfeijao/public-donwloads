name: Validar busca automática de versões (uma vez)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-cultoflow.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Executar descoberta CultoFlow agora
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run discover-updates.yml --repo ${{ github.repository }} --ref main -f app=cultoflow
