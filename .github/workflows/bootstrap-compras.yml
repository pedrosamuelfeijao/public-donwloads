name: Iniciar publicação Compras (uma vez)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-compras.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Lorde Agent no canal Compras Preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-installer.yml --repo ${{ github.repository }} --ref main \
            -f app=compras \
            -f channel=preview \
            -f source_tag=v0.4.0rc20 \
            -f version=0.4.0rc20
